- title: "Ask what's new in mountain biking"
  body: >-
    Six sources answer at once — the open web plus Pinkbike, Vital MTB, Singletracks, BikeRadar
    and r/MTB. Name a topic the way you would type it into a search box: "enduro world cup",
    "dropper post reliability", "Rotorua trails".

- title: "Ask one site directly"
  body: >-
    "What does Pinkbike say about the new Fox 36?" reads that source alone — one feed instead of
    six, so it answers in about a second, and a story everyone is running does not drown out the
    one place that covered it properly.

- title: "Follow a topic"
  body: >-
    Say you want something followed and it is saved as a tracked topic. Nothing is sent to you —
    the news is fetched when you ask — but "what am I following" then has an answer.
