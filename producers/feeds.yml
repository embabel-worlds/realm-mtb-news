# Read direct — Singletracks' own WordPress search feed answers without a bot wall, so there is no
# reason to go through an aggregator and lose the site's own excerpt.
- name: singletracksByTopic
  kind: feed
  url: 'https://www.singletracks.com/?s={key}&feed=rss2'
  keyAs: searchPhrase
  maxItems: 20
  minIntervalMs: 1000
  cache: { kind: ttl, seconds: 1800, negativeTtlSeconds: 600 }
