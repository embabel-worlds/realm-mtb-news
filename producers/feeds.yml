- name: redditMtbByTopic
  kind: remote
  operation: webSearch
  records: "$.web.results[*]"
  keyTemplate: "{key}"
  # Brave returns NOTHING for a path in the site: qualifier (`site:reddit.com/r/MTB` → 0 hits,
  # measured). Naming the subreddit as a plain term alongside a bare-domain site: does work —
  # 6 of 6 hits on r/MTB in the probe — so it is a strong filter rather than a guaranteed one.
  args: { q: "site:reddit.com r/MTB {keys}", count: 20, freshness: "py" }
  echoKeyAs: searchPhrase
  project: { url: url, title: title, summary: description, publishedAt: page_age, image: thumbnail.src }
  cache: { kind: ttl, seconds: 1800, negativeTtlSeconds: 600 }

# Read direct — Singletracks' own WordPress search feed answers without a bot wall, so there is no
# reason to go through an aggregator and lose the site's own excerpt.
- name: singletracksByTopic
  kind: feed
  url: 'https://www.singletracks.com/?s={key}&feed=rss2'
  keyAs: searchPhrase
  maxItems: 20
  minIntervalMs: 1000
  cache: { kind: ttl, seconds: 1800, negativeTtlSeconds: 600 }
