- name: mtb-tracked-topics
  description: >-
    The topics the user has saved to follow. Rows: {topic, notes}. Reads STORED nodes and fetches
    nothing — it answers "what am I following", never "what is new". Empty is normal: the news
    views work on an ad-hoc phrase without anything being tracked first.
  cypher: |
    MATCH (t:MtbTopic)
    RETURN t.topic AS topic, t.notes AS notes
    ORDER BY topic
